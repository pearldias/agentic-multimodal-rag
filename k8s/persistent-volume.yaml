apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-data-pv
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: agentic-multimodal-rag
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  hostPath:
    path: /tmp/agentic-rag-data
    type: DirectoryOrCreate
